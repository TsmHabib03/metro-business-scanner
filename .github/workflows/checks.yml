name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: metro_scanner
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U scanner -d metro_scanner" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://scanner:ci_test_only@127.0.0.1:5432/metro_scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
